# Standard Dependabot config (dependabot-std).
# Weekly, grouped, 7-day cooldown (time to catch a malicious release).

version: 2

updates:

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # CI runs PHP 7.4 + CakePHP 3; PHPUnit 9+ breaks the suite.
    # Explicit `versions` range: without a composer.lock Dependabot skips update-types.
    ignore:
      - dependency-name: phpunit/phpunit
        versions:
          - '>=9.0'
    groups:
      composer-deps:
        patterns:
          - '*'
